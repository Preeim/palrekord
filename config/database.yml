default: &default
  adapter: mysql2
  encoding: utf8mb4
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: root
  password: <%= ENV.fetch("DB_PASSWORD", "password123") %>
  <% unless ENV["CI"] %>
  socket: /var/run/mysqld/mysqld.sock
  <% end %>

development:
  <<: *default
  database: palrekord_development

test:
  <<: *default
  database: palrekord_test
  host: 127.0.0.1

production:
  <<: *default
  database: palrekord_production

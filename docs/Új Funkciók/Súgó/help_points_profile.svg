  <text x="62" y="486" font-size="13" font-weight="700" fill="#1e3a8a">Csak a legjobb saját eredményed számít a ranglistába</text>
  <text x="34" y="506" font-size="11.5" fill="#1e40af">Ha többször is megdöntöd vagy megismétled ugyanazt a kategóriát, csak a legjobb eredményed foglal helyezést és kap pontot.</text>
  <text x="34" y="522" font-size="11.5" fill="#1e40af">A korábbi, gyengébb kísérleteid 0 pt jelzéssel megmaradnak az archívumban, és nem tolják hátrébb a többieket.</text>
  <line x1="722" y1="460" x2="722" y2="414" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>


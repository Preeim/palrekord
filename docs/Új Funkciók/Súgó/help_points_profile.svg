  <text x="42" y="960" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">6</text>
  <text x="62" y="960" font-size="13" font-weight="700" fill="#1e3a8a">Kategóriánkénti pontbontás és saját beküldések követése</text>
  <text x="34" y="980" font-size="11.5" fill="#1e40af">A profilod alján tételesen látod, melyik kategóriából hány pontod származik, hányadik helyen állsz, és követheted a még jóváhagyásra váró</text>

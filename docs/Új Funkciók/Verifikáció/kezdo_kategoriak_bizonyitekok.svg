<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="60" fill="#fafafa"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="37" font-size="18" font-weight="700" fill="#111111">PálRecord</text>
  <text x="1160" y="36" font-size="12" text-anchor="end" fill="#666666">db/seeds.rb · Kezdő kategóriák</text>

  <!-- TITLE -->
  <text x="40" y="96" font-size="21" font-weight="700" fill="#111111">Kezdő kategóriák – Egyszerű, de védhető verifikációs bizonyítékok</text>
  <rect x="748" y="77" width="108" height="22" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="802" y="92" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">[ÚJ SEED]</text>
  <text x="40" y="116" font-size="12" fill="#555555">Minden kategória saját ajánlott menüponttal (`recommended_file_type`), súgóval (`verification_hint`) és megnyitható minta bizonyítékkal indul.</text>

  <!-- CARD 1: 100m sörfutás (y=130..234) -->
  <rect x="40" y="130" width="1120" height="102" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="156" font-size="15" font-weight="700" fill="#111111">1. 100m sörfutás</text>
  <text x="58" y="176" font-size="11" fill="#666666">mp · TIME_DURATION · ASC</text>
  <rect x="58" y="190" width="194" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.9"/>
  <text x="155" y="206" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Ajánlott: Videó / Link (LINK)</text>

  <line x1="322" y1="142" x2="322" y2="220" stroke="#eeeeee" stroke-width="1"/>
  <text x="340" y="156" font-size="12" font-weight="700" fill="#333333">Egyszerű és védhető bizonyíték:</text>
  <text x="340" y="176" font-size="12" fill="#111111">Vágatlan telefonos videó a rajtról, a pohár sörről és a célba érésről,</text>
  <text x="340" y="194" font-size="12" fill="#111111">vagy célfotó a stopperóráról legalább 1 jelenlévő tanúval.</text>
  <text x="340" y="216" font-size="11" fill="#1d4ed8">Védhetőség: egyben látható a táv, a sör és a pontos időmérés.</text>

  <line x1="818" y1="142" x2="818" y2="220" stroke="#eeeeee" stroke-width="1"/>
  <rect x="834" y="142" width="310" height="78" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="846" y="162" font-size="11" font-weight="700" fill="#333333">Seed minta bizonyíték:</text>
  <text x="846" y="182" font-size="11" fill="#444444">• LINK: nem listázott YouTube/videó URL</text>
  <text x="846" y="202" font-size="11" fill="#444444">• IMAGE: generált stopper-célfotó minta</text>

  <!-- CARD 2: Fekvenyomás max (y=244..346) -->
  <rect x="40" y="244" width="1120" height="102" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="270" font-size="15" font-weight="700" fill="#111111">2. Fekvenyomás max</text>
  <text x="58" y="290" font-size="11" fill="#666666">kg · DOUBLE · DESC</text>
  <rect x="58" y="304" width="194" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.9"/>
  <text x="155" y="320" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Ajánlott: Fotó / Kép (IMAGE)</text>

  <line x1="322" y1="256" x2="322" y2="334" stroke="#eeeeee" stroke-width="1"/>
  <text x="340" y="270" font-size="12" font-weight="700" fill="#333333">Egyszerű és védhető bizonyíték:</text>
  <text x="340" y="290" font-size="12" fill="#111111">1 fotó a felpakolt rúdról, amelyen tisztán leolvashatók a súlytárcsák (kg)</text>
  <text x="340" y="308" font-size="12" fill="#111111">feliratai (+ spotter / jelenlévő tanú neve a megjegyzésben).</text>
  <text x="340" y="330" font-size="11" fill="#1d4ed8">Védhetőség: objektíven visszaszámolható a rúd és a tárcsák összsúlya.</text>

  <line x1="818" y1="256" x2="818" y2="334" stroke="#eeeeee" stroke-width="1"/>
  <rect x="834" y="256" width="310" height="78" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="846" y="276" font-size="11" font-weight="700" fill="#333333">Seed minta bizonyíték:</text>
  <text x="846" y="296" font-size="11" fill="#444444">• IMAGE: rúd + súlytárcsák (20+20+12.5 kg)</text>
  <text x="846" y="316" font-size="11" fill="#444444">• Megjegyzés: spotter neve megjelölve</text>

  <!-- CARD 3: Legtöbb megevett palacsinta (y=358..460) -->
  <rect x="40" y="358" width="1120" height="102" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="384" font-size="15" font-weight="700" fill="#111111">3. Megevett palacsinta</text>
  <text x="58" y="404" font-size="11" fill="#666666">db · INT · DESC</text>
  <rect x="58" y="418" width="214" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.9"/>
  <text x="165" y="434" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Ajánlott: Tanú / Jegyzőkönyv (TEXT)</text>

  <line x1="322" y1="370" x2="322" y2="448" stroke="#eeeeee" stroke-width="1"/>
  <text x="340" y="384" font-size="12" font-weight="700" fill="#333333">Egyszerű és védhető bizonyíték:</text>
  <text x="340" y="404" font-size="12" fill="#111111">Strukturált tanú-jegyzőkönyv legalább 2 jelenlévő barát nevével és a</text>
  <text x="340" y="422" font-size="12" fill="#111111">helyszínnel, vagy fotó a strigulázott számlálólapról és az üres tányérról.</text>
  <text x="340" y="444" font-size="11" fill="#1d4ed8">Védhetőség: több név szerint megjelölt, megkérdezhető tanú hitelesíti.</text>

  <line x1="818" y1="370" x2="818" y2="448" stroke="#eeeeee" stroke-width="1"/>
  <rect x="834" y="370" width="310" height="78" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="846" y="390" font-size="11" font-weight="700" fill="#333333">Seed minta bizonyíték:</text>
  <text x="846" y="410" font-size="11" fill="#444444">• TEXT: kitöltött tanú-jegyzőkönyv sablon</text>
  <text x="846" y="430" font-size="11" fill="#444444">• IMAGE: generált strigulalap minta fotó</text>

  <!-- CARD 4: Planking kitartás (y=472..574) -->
  <rect x="40" y="472" width="1120" height="102" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="498" font-size="15" font-weight="700" fill="#111111">4. Planking kitartás</text>
  <text x="58" y="518" font-size="11" fill="#666666">perc · TIME_DURATION · DESC</text>
  <rect x="58" y="532" width="194" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.9"/>
  <text x="155" y="548" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Ajánlott: Fotó / Kép (IMAGE)</text>

  <line x1="322" y1="484" x2="322" y2="562" stroke="#eeeeee" stroke-width="1"/>
  <text x="340" y="498" font-size="12" font-weight="700" fill="#333333">Egyszerű és védhető bizonyíték:</text>
  <text x="340" y="518" font-size="12" fill="#111111">Képernyőkép vagy fotó a telefon stopperóráról / okosóra edzés-összesítőről</text>
  <text x="340" y="536" font-size="12" fill="#111111">közvetlenül a plank befejezésekor (+ esetleges tanú neve).</text>
  <text x="340" y="558" font-size="11" fill="#1d4ed8">Védhetőség: pontos időbélyeggel és pulzus/edzésadattal alátámasztható.</text>

  <line x1="818" y1="484" x2="818" y2="562" stroke="#eeeeee" stroke-width="1"/>
  <rect x="834" y="484" width="310" height="78" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="846" y="504" font-size="11" font-weight="700" fill="#333333">Seed minta bizonyíték:</text>
  <text x="846" y="524" font-size="11" fill="#444444">• IMAGE: telefonos stopperóra / edzés</text>
  <text x="846" y="544" font-size="11" fill="#444444">  képernyőkép generált minta (04:12.00)</text>

  <!-- CARD 5: Rubik-kocka 3x3 (y=586..688) -->
  <rect x="40" y="586" width="1120" height="102" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="58" y="612" font-size="15" font-weight="700" fill="#111111">5. Rubik-kocka 3x3</text>
  <text x="58" y="632" font-size="11" fill="#666666">mp · DOUBLE · ASC</text>
  <rect x="58" y="646" width="194" height="24" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.9"/>
  <text x="155" y="662" font-size="11" font-weight="700" text-anchor="middle" fill="#1e40af">Ajánlott: Fotó / Kép (IMAGE)</text>

  <line x1="322" y1="598" x2="322" y2="676" stroke="#eeeeee" stroke-width="1"/>
  <text x="340" y="612" font-size="12" font-weight="700" fill="#333333">Egyszerű és védhető bizonyíték:</text>
  <text x="340" y="632" font-size="12" fill="#111111">1 közös fotó, amelyen egyszerre látszik a kirakott Rubik-kocka és mellette</text>
  <text x="340" y="650" font-size="12" fill="#111111">a timer kijelzője (pl. csTimer / Twisty Timer idővel és keverési kóddal).</text>
  <text x="340" y="672" font-size="11" fill="#1d4ed8">Védhetőség: egyetlen képben látszik a végeredmény, a pontos idő és a scramble.</text>

  <line x1="818" y1="598" x2="818" y2="676" stroke="#eeeeee" stroke-width="1"/>
  <rect x="834" y="598" width="310" height="78" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="846" y="618" font-size="11" font-weight="700" fill="#333333">Seed minta bizonyíték:</text>
  <text x="846" y="638" font-size="11" fill="#444444">• IMAGE: kirakott kocka + csTimer</text>
  <text x="846" y="658" font-size="11" fill="#444444">  kijelző közös minta igazolókép</text>

  <!-- FOOTER -->
  <rect x="0" y="704" width="1200" height="56" fill="#fafafa"/>
  <line x1="0" y1="704" x2="1200" y2="704" stroke="#dddddd" stroke-width="1"/>
  <text x="600" y="736" font-size="12" text-anchor="middle" fill="#666666">PálRecord · Baráti rekordgyűjtő · Minimalista bizonyítási elvek: 10 mp alatt elkészíthető, utólag ellenőrizhető</text>
</svg>

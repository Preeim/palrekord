  <text x="68" y="601" font-size="11" fill="#111111">https://youtube.com/shorts/sorfutas-1842</text>
  <text x="58" y="636" font-size="11" fill="#555555">• Támogatott: http:// vagy https:// URL.</text>
  <text x="58" y="656" font-size="11" fill="#555555">• Telefonos videó Google Fotókról, Drive-ról,</text>
  <text x="66" y="672" font-size="11" fill="#555555">nem listázott YouTube Shorts vagy Strava link.</text>
  <text x="58" y="704" font-size="11" font-weight="600" fill="#1d4ed8">Csak ez az 1 mező jelenik meg aktív LINK fülnél.</text>


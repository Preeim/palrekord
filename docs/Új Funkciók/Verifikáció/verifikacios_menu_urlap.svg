  <rect x="58" y="190" width="1084" height="38" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <rect x="68" y="200" width="44" height="18" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="0.8"/>
  <text x="90" y="213" font-size="10" font-weight="700" text-anchor="middle" fill="#1e40af">[ÚJ 1]</text>
  <text x="122" y="214" font-size="12" font-weight="600" fill="#1e3a8a">Ajánlott bizonyítás ehhez a kategóriához: <tspan font-weight="400">1 közös fotó a kirakott kockáról és a timer kijelzőjéről (pl. csTimer idő + keverés).</tspan></text>


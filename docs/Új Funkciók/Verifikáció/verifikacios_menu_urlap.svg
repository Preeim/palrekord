  <text x="76" y="432" font-size="11" fill="#555555">Engedélyezett: PNG, JPG, JPEG, GIF, WEBP (max. 10 MB). A többi melléklettípus mezője automatikusan el van rejtve.</text>

  <!-- PREVIEW OF OTHER MENU STATES (y=486..732) -->

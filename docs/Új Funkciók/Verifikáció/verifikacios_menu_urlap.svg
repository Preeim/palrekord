  <text x="834" y="688" font-size="11" fill="#555555">• Nem küld üres mellékletet vagy hibát mentéskor.</text>
  <text x="834" y="704" font-size="11" fill="#1d4ed8">• Szerveroldalon: automatikus típusfelismerés.</text>


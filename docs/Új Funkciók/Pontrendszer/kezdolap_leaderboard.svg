<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="780" fill="#ffffff"/>

  <!-- HEADER (site-header) -->
  <rect x="0" y="0" width="1200" height="60" fill="#fafafa"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="37" font-size="18" font-weight="700" fill="#111111">PálRecord</text>

  <!-- Header Right Nav (Logged in with points in Profile button) -->
  <rect x="650" y="15" width="96" height="30" rx="3" fill="#222222"/>
  <text x="698" y="34" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">+ Új rekord</text>

  <rect x="756" y="15" width="212" height="30" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="862" y="34" font-size="12" text-anchor="middle" fill="#111111">Profil (Nagy Bence · <tspan font-weight="700">38 pt</tspan>)</text>

  <rect x="978" y="15" width="66" height="30" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1011" y="34" font-size="12" text-anchor="middle" fill="#111111">Admin</text>

  <rect x="1054" y="15" width="106" height="30" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1107" y="34" font-size="12" text-anchor="middle" fill="#111111">Kijelentkezés</text>

  <!-- Annotation arrow for header points -->
  <text x="862" y="78" font-size="11" text-anchor="middle" fill="#666666">↑ Saját összpontszám azonnal látható a fejlécben</text>

  <!-- MAIN CONTAINER (x=40 to 1160) -->
  <!-- LEFT COLUMN: KATEGÓRIÁK (x=40, w=720) -->
  <text x="40" y="118" font-size="22" font-weight="700" fill="#111111">Kategóriák</text>
  <text x="40" y="140" font-size="13" fill="#666666">Válassz egy versenyszámot a ranglistához. Saját kategória létrehozásával új pontokat nyithatsz meg.</text>

  <!-- New Category button with monthly quota indicator -->
  <rect x="528" y="98" width="232" height="32" rx="3" fill="#222222"/>
  <text x="644" y="118" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">+ Új versenyszám (Kvóta: 1/2)</text>

  <!-- Categories Table -->
  <rect x="40" y="160" width="720" height="440" rx="4" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>
  <!-- Table Header -->
  <rect x="40" y="160" width="720" height="38" rx="4" fill="#fafafa"/>
  <line x1="40" y1="198" x2="760" y2="198" stroke="#cccccc" stroke-width="1.2"/>
  <text x="56" y="184" font-size="11" font-weight="700" fill="#555555">KATEGÓRIA NEVE</text>
  <text x="275" y="184" font-size="11" font-weight="700" fill="#555555">RENDEZÉS</text>
  <text x="425" y="184" font-size="11" font-weight="700" fill="#555555">RÉSZTVEVŐK / 1. HELY</text>
  <text x="585" y="184" font-size="11" font-weight="700" fill="#555555">TOP 1 EREDMÉNY</text>

  <!-- Row 1 -->
  <text x="56" y="228" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">100m sörfutás</text>
  <rect x="56" y="236" width="112" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="112" y="249" font-size="10" text-anchor="middle" fill="#334155">2026 Őszi Szezon</text>
  <text x="275" y="234" font-size="12" fill="#555555">TIME · ASC</text>
  <text x="425" y="234" font-size="12" fill="#333333">12 fő (max <tspan font-weight="700">12 pt</tspan>)</text>
  <text x="585" y="228" font-size="13" font-weight="700" fill="#111111">18.42 mp</text>
  <text x="585" y="246" font-size="12" fill="#555555">Kovács Peti (+12 pt)</text>
  <line x1="40" y1="268" x2="760" y2="268" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="56" y="302" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">Fekvenyomás max</text>
  <text x="275" y="302" font-size="12" fill="#555555">DOUBLE · DESC</text>
  <text x="425" y="302" font-size="12" fill="#333333">8 fő (max <tspan font-weight="700">8 pt</tspan>)</text>
  <text x="585" y="296" font-size="13" font-weight="700" fill="#111111">125.0 kg</text>
  <text x="585" y="314" font-size="12" fill="#555555">Nagy Bence (+8 pt)</text>
  <line x1="40" y1="334" x2="760" y2="334" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="56" y="368" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">Megevett palacsinta</text>
  <text x="275" y="368" font-size="12" fill="#555555">INT · DESC</text>
  <text x="425" y="368" font-size="12" fill="#333333">5 fő (max <tspan font-weight="700">5 pt</tspan>)</text>
  <text x="585" y="362" font-size="13" font-weight="700" fill="#111111">19 db</text>
  <text x="585" y="380" font-size="12" fill="#555555">Tóth Ádám (+5 pt)</text>
  <line x1="40" y1="400" x2="760" y2="400" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="56" y="434" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">Planking kitartás</text>
  <rect x="56" y="442" width="112" height="18" rx="2" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="0.8"/>
  <text x="112" y="455" font-size="10" text-anchor="middle" fill="#334155">2026 Őszi Szezon</text>
  <text x="275" y="440" font-size="12" fill="#555555">TIME · DESC</text>
  <text x="425" y="440" font-size="12" fill="#333333">3 fő (max <tspan font-weight="700">3 pt</tspan>)</text>
  <text x="585" y="434" font-size="13" font-weight="700" fill="#111111">04:12.00</text>
  <text x="585" y="452" font-size="12" fill="#555555">Szabó Anna (+3 pt)</text>
  <line x1="40" y1="474" x2="760" y2="474" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 5 -->
  <text x="56" y="508" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">Rubik-kocka 3x3</text>
  <text x="275" y="508" font-size="12" fill="#555555">DOUBLE · ASC</text>
  <text x="425" y="508" font-size="12" fill="#333333">1 fő (max <tspan font-weight="700">1 pt</tspan>)</text>
  <text x="585" y="502" font-size="13" font-weight="700" fill="#111111">34.10 mp</text>
  <text x="585" y="520" font-size="12" fill="#555555">Nagy Bence (+1 pt)</text>
  <line x1="40" y1="540" x2="760" y2="540" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 6 (Empty state) -->
  <text x="56" y="574" font-size="14" font-weight="600" fill="#111111" text-decoration="underline">Biliárd gyorsbontás</text>
  <text x="275" y="574" font-size="12" fill="#555555">INT · ASC</text>
  <text x="425" y="574" font-size="12" fill="#777777">0 fő (max 0 pt)</text>
  <text x="585" y="574" font-size="12" font-style="italic" fill="#888888">Még nincs elfogadott rekord</text>

  <!-- RIGHT SIDEBAR: LEADERBOARD CARD (x=790, w=370, y=98, h=502) -->
  <rect x="790" y="98" width="370" height="502" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="790" y="98" width="370" height="44" rx="4" fill="#fafafa"/>
  <line x1="790" y1="142" x2="1160" y2="142" stroke="#dddddd" stroke-width="1"/>
  <text x="808" y="126" font-size="16" font-weight="700" fill="#111111">Leaderboard (Ranglista)</text>

  <!-- Tabs: Örökös vs Szezon -->
  <rect x="808" y="156" width="164" height="30" rx="3" fill="#222222"/>
  <text x="890" y="175" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Örökös Élő</text>

  <rect x="978" y="156" width="164" height="30" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1060" y="175" font-size="12" text-anchor="middle" fill="#333333">2026 Őszi Szezon</text>

  <!-- Leaderboard Columns Header -->
  <line x1="808" y1="202" x2="1142" y2="202" stroke="#dddddd" stroke-width="1"/>
  <text x="814" y="220" font-size="11" font-weight="700" fill="#555555">#</text>
  <text x="840" y="220" font-size="11" font-weight="700" fill="#555555">TAG</text>
  <text x="1032" y="220" font-size="11" font-weight="700" text-anchor="end" fill="#555555">1. HELY</text>
  <text x="1136" y="220" font-size="11" font-weight="700" text-anchor="end" fill="#555555">PONT</text>
  <line x1="808" y1="230" x2="1142" y2="230" stroke="#cccccc" stroke-width="1"/>

  <!-- Rank 1 -->
  <text x="814" y="258" font-size="14" font-weight="700" fill="#111111">1.</text>
  <text x="840" y="258" font-size="14" font-weight="600" fill="#111111">Kovács Peti</text>
  <text x="1032" y="258" font-size="12" text-anchor="end" fill="#666666">3x</text>
  <text x="1136" y="258" font-size="14" font-weight="700" text-anchor="end" fill="#111111">42 pt</text>
  <line x1="808" y1="274" x2="1142" y2="274" stroke="#eeeeee" stroke-width="1"/>

  <!-- Rank 2 (Highlighted current user) -->
  <rect x="804" y="278" width="342" height="36" rx="2" fill="#f3f4f6"/>
  <text x="814" y="301" font-size="14" font-weight="700" fill="#111111">2.</text>
  <text x="840" y="301" font-size="14" font-weight="700" fill="#111111">Nagy Bence (Te)</text>
  <text x="1032" y="301" font-size="12" text-anchor="end" fill="#444444">2x</text>
  <text x="1136" y="301" font-size="14" font-weight="700" text-anchor="end" fill="#111111">38 pt</text>
  <line x1="808" y1="318" x2="1142" y2="318" stroke="#eeeeee" stroke-width="1"/>

  <!-- Rank 3 -->
  <text x="814" y="346" font-size="14" font-weight="700" fill="#111111">3.</text>
  <text x="840" y="346" font-size="14" fill="#111111">Tóth Ádám</text>
  <text x="1032" y="346" font-size="12" text-anchor="end" fill="#666666">1x</text>
  <text x="1136" y="346" font-size="14" font-weight="700" text-anchor="end" fill="#111111">29 pt</text>
  <line x1="808" y1="362" x2="1142" y2="362" stroke="#eeeeee" stroke-width="1"/>

  <!-- Rank 4 -->
  <text x="814" y="390" font-size="14" font-weight="700" fill="#111111">4.</text>
  <text x="840" y="390" font-size="14" fill="#111111">Szabó Anna</text>
  <text x="1032" y="390" font-size="12" text-anchor="end" fill="#666666">1x</text>
  <text x="1136" y="390" font-size="14" font-weight="700" text-anchor="end" fill="#111111">24 pt</text>
  <line x1="808" y1="406" x2="1142" y2="406" stroke="#eeeeee" stroke-width="1"/>

  <!-- Rank 5 -->
  <text x="814" y="434" font-size="14" font-weight="700" fill="#111111">5.</text>
  <text x="840" y="434" font-size="14" fill="#111111">Varga Márk</text>
  <text x="1032" y="434" font-size="12" text-anchor="end" fill="#666666">0x</text>
  <text x="1136" y="434" font-size="14" font-weight="700" text-anchor="end" fill="#111111">15 pt</text>
  <line x1="808" y1="450" x2="1142" y2="450" stroke="#eeeeee" stroke-width="1"/>

  <!-- Explanation box inside sidebar -->
  <rect x="808" y="472" width="334" height="108" rx="3" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="822" y="494" font-size="12" font-weight="700" fill="#333333">Hogyan számolódnak a pontok?</text>
  <text x="822" y="514" font-size="11" fill="#555555">• Minden aktív kategóriában csak a legjobb saját</text>
  <text x="830" y="530" font-size="11" fill="#555555">elfogadott eredményed számít.</text>
  <text x="822" y="548" font-size="11" fill="#555555">• Logaritmikus pontozás (N fő → 1. hely = N pt).</text>
  <text x="822" y="566" font-size="11" fill="#555555">• Szezon fül: csak a szezonban indított kategóriák.</text>

  <!-- FOOTER (site-footer) -->
  <rect x="0" y="724" width="1200" height="56" fill="#fafafa"/>
  <line x1="0" y1="724" x2="1200" y2="724" stroke="#dddddd" stroke-width="1"/>
  <text x="600" y="756" font-size="12" text-anchor="middle" fill="#666666">PálRecord · Baráti rekordgyűjtő</text>
</svg>

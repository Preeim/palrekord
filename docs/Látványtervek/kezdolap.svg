<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="60" fill="#fafafa"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#111111">PálRecord</text>

  <!-- Header Right Buttons (Not logged in) -->
  <rect x="935" y="16" width="108" height="28" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="989" y="34" font-size="13" text-anchor="middle" fill="#111111">Bejelentkezés</text>

  <rect x="1055" y="16" width="105" height="28" rx="3" fill="#222222"/>
  <text x="1107" y="34" font-size="13" text-anchor="middle" fill="#ffffff">Regisztráció</text>

  <!-- Annotation for logged-in state -->
  <text x="1160" y="78" font-size="11" text-anchor="end" fill="#888888">(Ha be van jelentkezve: [Kijelentkezés] gomb jelenik meg itt)</text>

  <!-- MAIN CONTENT (Centered with side margins: x=220 to x=980, width=760) -->
  <!-- Side margin guides (subtle dashed) -->
  <line x1="220" y1="90" x2="220" y2="680" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="980" y1="90" x2="980" y2="680" stroke="#eeeeee" stroke-width="1" stroke-dasharray="4,4"/>

  <text x="220" y="128" font-size="22" font-weight="700" fill="#111111">Kategóriák</text>
  <text x="220" y="150" font-size="13" fill="#666666">Válassz egy versenyszámot a teljes ranglista megtekintéséhez.</text>

  <!-- Minimalist Table / List -->
  <!-- Table Header -->
  <line x1="220" y1="175" x2="980" y2="175" stroke="#cccccc" stroke-width="1.5"/>
  <text x="232" y="198" font-size="12" font-weight="700" fill="#555555">KATEGÓRIA NEVE</text>
  <text x="520" y="198" font-size="12" font-weight="700" fill="#555555">RENDEZÉS (SORT_BY)</text>
  <text x="720" y="198" font-size="12" font-weight="700" fill="#555555">TOP 1 EREDMÉNY</text>
  <line x1="220" y1="210" x2="980" y2="210" stroke="#cccccc" stroke-width="1.5"/>

  <!-- Row 1 -->
  <text x="232" y="242" font-size="15" font-weight="600" fill="#111111" text-decoration="underline">100m sörfutás</text>
  <text x="520" y="242" font-size="13" fill="#555555">TIME_DURATION · ASC</text>
  <text x="720" y="236" font-size="14" font-weight="600" fill="#111111">18.42 mp</text>
  <text x="720" y="253" font-size="12" fill="#666666">Kovács Peti</text>
  <line x1="220" y1="268" x2="980" y2="268" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 2 -->
  <text x="232" y="300" font-size="15" font-weight="600" fill="#111111" text-decoration="underline">Fekvenyomás max</text>
  <text x="520" y="300" font-size="13" fill="#555555">DOUBLE · DESC</text>
  <text x="720" y="294" font-size="14" font-weight="600" fill="#111111">125.0 kg</text>
  <text x="720" y="311" font-size="12" fill="#666666">Nagy Bence</text>
  <line x1="220" y1="326" x2="980" y2="326" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 3 -->
  <text x="232" y="358" font-size="15" font-weight="600" fill="#111111" text-decoration="underline">Legtöbb megevett palacsinta</text>
  <text x="520" y="358" font-size="13" fill="#555555">INT · DESC</text>
  <text x="720" y="352" font-size="14" font-weight="600" fill="#111111">19 db</text>
  <text x="720" y="369" font-size="12" fill="#666666">Tóth Ádám</text>
  <line x1="220" y1="384" x2="980" y2="384" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 4 -->
  <text x="232" y="416" font-size="15" font-weight="600" fill="#111111" text-decoration="underline">Planking kitartás</text>
  <text x="520" y="416" font-size="13" fill="#555555">TIME_DURATION · DESC</text>
  <text x="720" y="410" font-size="14" font-weight="600" fill="#111111">04:12.00</text>
  <text x="720" y="427" font-size="12" fill="#666666">Szabó Anna</text>
  <line x1="220" y1="442" x2="980" y2="442" stroke="#eeeeee" stroke-width="1"/>

  <!-- Row 5 (Empty state example) -->
  <text x="232" y="474" font-size="15" font-weight="600" fill="#111111" text-decoration="underline">Rubik-kocka 3x3</text>
  <text x="520" y="474" font-size="13" fill="#555555">DOUBLE · ASC</text>
  <text x="720" y="474" font-size="13" font-style="italic" fill="#888888">Még nincs elfogadott rekord</text>
  <line x1="220" y1="496" x2="980" y2="496" stroke="#cccccc" stroke-width="1"/>

  <!-- FOOTER -->
  <rect x="0" y="704" width="1200" height="56" fill="#fafafa"/>
  <line x1="0" y1="704" x2="1200" y2="704" stroke="#dddddd" stroke-width="1"/>
  <text x="600" y="736" font-size="12" text-anchor="middle" fill="#666666">PálRecord · Baráti rekordgyűjtő</text>
</svg>

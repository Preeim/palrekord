  <text x="58" y="670" font-size="11" fill="#1e40af"><tspan font-weight="700">[ÚJ 1] Fejléc:</tspan> Saját élő összpontszám a Profil gomb mellett · <tspan font-weight="700">[ÚJ 2] Havi kvóta:</tspan> Tagoknál limitált új versenyszám gomb (<tspan font-family="monospace">Kvóta: 1/2</tspan>)</text>
  <text x="58" y="690" font-size="11" fill="#1e40af"><tspan font-weight="700">[ÚJ 3] Táblázat:</tspan> Szezon jelvény, Résztvevők / 1. hely max pont oszlop és Top 1 (+pt) · <tspan font-weight="700">[ÚJ 4] Oldalsáv:</tspan> Örökös Élő / Szezon ranglista</text>


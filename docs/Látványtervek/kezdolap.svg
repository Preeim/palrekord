  <!-- Explanation box inside sidebar -->
  <rect x="808" y="472" width="334" height="108" rx="3" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="822" y="494" font-size="12" font-weight="700" fill="#333333">Hogyan számolódnak a pontok?</text>
  <text x="822" y="514" font-size="11" fill="#555555">• Minden aktív kategóriában csak a legjobb saját</text>
  <text x="830" y="530" font-size="11" fill="#555555">elfogadott eredményed számít.</text>
  <text x="822" y="548" font-size="11" fill="#555555">• Logaritmikus pontozás (N fő → 1. hely = N pt).</text>
  <text x="822" y="566" font-size="11" fill="#555555">• Szezon fül: csak a szezonban indított kategóriák.</text>

  <!-- LEGEND FOR NEW FEATURES (y=628..704) -->
  <rect x="40" y="628" width="1120" height="76" rx="5" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="1200" height="760" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <!-- Background -->
  <rect width="1200" height="760" fill="#ffffff"/>

  <!-- HEADER -->
  <rect x="0" y="0" width="1200" height="60" fill="#fafafa"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#dddddd" stroke-width="1"/>
  <text x="40" y="36" font-size="18" font-weight="700" fill="#111111">PálRecord</text>

  <!-- Header Right Buttons -->
  <rect x="935" y="16" width="108" height="28" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="989" y="34" font-size="13" text-anchor="middle" fill="#111111">Bejelentkezés</text>

  <rect x="1055" y="16" width="105" height="28" rx="3" fill="#222222"/>
  <text x="1107" y="34" font-size="13" text-anchor="middle" fill="#ffffff">Regisztráció</text>

  <!-- CENTERED BOX (410, 175, w=380, h=370) -->
  <rect x="410" y="175" width="380" height="370" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>

  <text x="442" y="218" font-size="20" font-weight="700" fill="#111111">Bejelentkezés</text>

  <!-- Username / Email field -->
  <text x="442" y="254" font-size="13" font-weight="600" fill="#333333">Felhasználónév vagy e-mail</text>
  <rect x="442" y="264" width="316" height="36" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="454" y="287" font-size="13" fill="#999999">pl. bence99</text>

  <!-- Password field -->
  <text x="442" y="328" font-size="13" font-weight="600" fill="#333333">Jelszó</text>
  <rect x="442" y="338" width="316" height="36" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="454" y="361" font-size="13" fill="#999999">••••••••</text>

  <!-- Submit button -->
  <rect x="442" y="396" width="316" height="38" rx="3" fill="#222222"/>
  <text x="600" y="420" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Belépés</text>

  <!-- Optional forgot password link -->
  <text x="600" y="458" font-size="12" text-anchor="middle" fill="#555555" text-decoration="underline">Elfelejtett jelszó?</text>

  <!-- Bottom divider + toggle to Register -->
  <line x1="442" y1="484" x2="758" y2="484" stroke="#eeeeee" stroke-width="1"/>
  <text x="600" y="514" font-size="13" text-anchor="middle" fill="#444444">
    Még nincs fiókod? <tspan font-weight="600" fill="#111111" text-decoration="underline">Regisztráció</tspan>
  </text>

  <!-- FOOTER -->
  <rect x="0" y="704" width="1200" height="56" fill="#fafafa"/>
  <line x1="0" y1="704" x2="1200" y2="704" stroke="#dddddd" stroke-width="1"/>
  <text x="600" y="736" font-size="12" text-anchor="middle" fill="#666666">PálRecord · Baráti rekordgyűjtő</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="1200" height="840" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="help-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="840" fill="#f8fafc"/>

  <!-- ==================== LEFT SCREEN: LOGIN (/login) ==================== -->
  <rect x="24" y="110" width="556" height="590" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Mini Header -->
  <rect x="25" y="111" width="554" height="52" rx="5" fill="#fafafa"/>
  <line x1="24" y1="163" x2="580" y2="163" stroke="#dddddd" stroke-width="1"/>
  <text x="46" y="143" font-size="16" font-weight="700" fill="#111111">PálRecord</text>
  <rect x="358" y="123" width="96" height="28" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="406" y="141" font-size="12" text-anchor="middle" fill="#111111">Bejelentkezés</text>
  <rect x="464" y="123" width="96" height="28" rx="3" fill="#222222"/>
  <text x="512" y="141" font-size="12" text-anchor="middle" fill="#ffffff">Regisztráció</text>

  <!-- Login Card (x=112, y=200, w=380, h=370) -->
  <rect x="112" y="200" width="380" height="370" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="144" y="242" font-size="20" font-weight="700" fill="#111111">Bejelentkezés</text>

  <text x="144" y="278" font-size="13" font-weight="600" fill="#333333">Felhasználónév vagy e-mail</text>
  <rect x="144" y="288" width="316" height="36" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="156" y="311" font-size="13" fill="#999999">pl. bence99</text>

  <text x="144" y="352" font-size="13" font-weight="600" fill="#333333">Jelszó</text>
  <rect x="144" y="362" width="316" height="36" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="156" y="385" font-size="13" fill="#999999">••••••••</text>

  <rect x="144" y="420" width="316" height="38" rx="3" fill="#222222"/>
  <text x="302" y="444" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Belépés</text>

  <text x="302" y="482" font-size="12" text-anchor="middle" fill="#1d4ed8" text-decoration="underline" font-weight="600">Elfelejtett jelszó?</text>

  <line x1="144" y1="508" x2="460" y2="508" stroke="#eeeeee" stroke-width="1"/>
  <text x="302" y="538" font-size="13" text-anchor="middle" fill="#444444">
    Még nincs fiókod? <tspan font-weight="600" fill="#111111" text-decoration="underline">Regisztráció</tspan>
  </text>

  <!-- ==================== RIGHT SCREEN: REGISTER (/register) ==================== -->
  <rect x="620" y="110" width="556" height="590" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Mini Header -->
  <rect x="621" y="111" width="554" height="52" rx="5" fill="#fafafa"/>
  <line x1="620" y1="163" x2="1176" y2="163" stroke="#dddddd" stroke-width="1"/>
  <text x="642" y="143" font-size="16" font-weight="700" fill="#111111">PálRecord</text>
  <rect x="954" y="123" width="96" height="28" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1002" y="141" font-size="12" text-anchor="middle" fill="#111111">Bejelentkezés</text>
  <rect x="1060" y="123" width="96" height="28" rx="3" fill="#222222"/>
  <text x="1108" y="141" font-size="12" text-anchor="middle" fill="#ffffff">Regisztráció</text>

  <!-- Register Card (x=708, y=178, w=380, h=504) -->
  <rect x="708" y="178" width="380" height="504" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="740" y="214" font-size="20" font-weight="700" fill="#111111">Regisztráció</text>

  <text x="740" y="244" font-size="12.5" font-weight="600" fill="#333333">Felhasználónév *</text>
  <rect x="740" y="252" width="316" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="752" y="272" font-size="12.5" fill="#999999">pl. bence99</text>

  <text x="740" y="306" font-size="12.5" font-weight="600" fill="#333333">Megjelenített név (becenév) *</text>
  <rect x="740" y="314" width="316" height="32" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="752" y="334" font-size="12.5" fill="#999999">pl. Nagy Bence</text>

  <text x="740" y="368" font-size="12.5" font-weight="600" fill="#333333">E-mail cím (beállítástól függően)</text>
  <rect x="740" y="376" width="316" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="752" y="396" font-size="12.5" fill="#999999">bence@example.com</text>

  <text x="740" y="430" font-size="12.5" font-weight="600" fill="#333333">Jelszó *</text>
  <rect x="740" y="438" width="316" height="32" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="752" y="458" font-size="12.5" fill="#999999">min. 6 karakter</text>

  <text x="740" y="492" font-size="12.5" font-weight="600" fill="#333333">Meghívókód *</text>
  <rect x="740" y="500" width="316" height="32" rx="3" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <text x="752" y="520" font-size="12.5" fill="#111111">PAL-2026-BARAT</text>

  <rect x="740" y="550" width="316" height="36" rx="3" fill="#222222"/>
  <text x="898" y="573" font-size="14" font-weight="600" text-anchor="middle" fill="#ffffff">Fiók létrehozása</text>

  <line x1="740" y1="606" x2="1056" y2="606" stroke="#eeeeee" stroke-width="1"/>
  <text x="898" y="634" font-size="13" text-anchor="middle" fill="#444444">
    Már van fiókod? <tspan font-weight="600" fill="#111111" text-decoration="underline">Bejelentkezés</tspan>
  </text>

  <!-- ==================== CALLOUTS & ARROWS ==================== -->
  <!-- TOP LEFT [1]: Rugalmas bejelentkezés -->
  <rect x="24" y="14" width="556" height="78" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="46" cy="36" r="11" fill="#1d4ed8"/>
  <text x="46" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="66" y="40" font-size="13" font-weight="700" fill="#1e3a8a">Bejelentkezés felhasználónévvel vagy e-maillel</text>
  <text x="38" y="60" font-size="11.5" fill="#1e40af">A belépéshez elég megadnod a felhasználónevedet (pl. bence99) vagy az</text>
  <text x="38" y="77" font-size="11.5" fill="#1e40af">e-mail címedet és a jelszavadat. Sikeres belépés után a kezdőlapra érkezel.</text>
  <path d="M 88 92 L 88 306 L 140 306" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- BOTTOM LEFT [2]: Elfelejtett jelszó -->
  <rect x="24" y="720" width="556" height="96" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="46" cy="742" r="11" fill="#1d4ed8"/>
  <text x="46" y="746" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="66" y="746" font-size="13" font-weight="700" fill="#1e3a8a">Elfelejtett jelszó és ideiglenes jelszó</text>
  <text x="38" y="768" font-size="11.5" fill="#1e40af">Aktív e-mail rendszernél linken állíthatod vissza a jelszavadat. Kikapcsolt</text>
  <text x="38" y="785" font-size="11.5" fill="#1e40af">e-mail esetén kérj egyszeri ideiglenes jelszót az admintól, majd belépés</text>
  <text x="38" y="802" font-size="11.5" fill="#1e40af">után a Profil oldalon add meg az új jelszót.</text>
  <line x1="302" y1="720" x2="302" y2="492" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- TOP RIGHT [3]: Felhasználónév vs. Becenév -->
  <rect x="620" y="14" width="556" height="78" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="642" cy="36" r="11" fill="#1d4ed8"/>
  <text x="642" y="40" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="662" y="40" font-size="13" font-weight="700" fill="#1e3a8a">Felhasználónév vs. Megjelenített név (becenév)</text>
  <text x="634" y="60" font-size="11.5" fill="#1e40af">A felhasználónév egyedi belépési azonosító, míg a beceneved jelenik meg</text>
  <text x="634" y="77" font-size="11.5" fill="#1e40af">nyilvánosan a ranglistákon, a rekordok mellett és a profilodon.</text>
  <path d="M 672 92 L 672 330 L 736 330" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- BOTTOM RIGHT [4]: Meghívókód -->
  <rect x="620" y="720" width="556" height="96" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="642" cy="742" r="11" fill="#1d4ed8"/>
  <text x="642" y="746" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="662" y="746" font-size="13" font-weight="700" fill="#1e3a8a">Meghívókód (Invite Code) – Zárt közösségi védelem</text>
  <text x="634" y="768" font-size="11.5" fill="#1e40af">Ha a közösség meghívásos módban működik, a regisztrációhoz meg kell</text>
  <text x="634" y="785" font-size="11.5" fill="#1e40af">adnod az admintól kapott kódot (pl. PAL-2026-BARAT).</text>
  <text x="634" y="802" font-size="11.5" fill="#1e40af">Minden felhasználás után csökken a kód fennmaradó kerete.</text>
  <path d="M 1114 720 L 1114 516 L 1060 516" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 980" width="1200" height="980" font-family="system-ui, -apple-system, Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="help-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="980" fill="#f8fafc"/>

  <!-- ==================== TOP SCREEN: RECORD FORM & MENU (y=108..546) ==================== -->
  <rect x="24" y="108" width="1152" height="438" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Mini Header -->
  <rect x="25" y="109" width="1150" height="52" rx="5" fill="#fafafa"/>
  <line x1="24" y1="161" x2="1176" y2="161" stroke="#dddddd" stroke-width="1"/>
  <text x="48" y="141" font-size="16" font-weight="700" fill="#111111">PálRecord · Új rekord beküldése</text>
  <rect x="1032" y="121" width="122" height="28" rx="3" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1093" y="139" font-size="12" text-anchor="middle" fill="#111111">← Vissza a listához</text>

  <!-- Top Record Form Fields (y=176..314) -->
  <rect x="48" y="176" width="1104" height="138" rx="5" fill="#ffffff" stroke="#dddddd" stroke-width="1"/>

  <text x="66" y="198" font-size="12" font-weight="700" fill="#333333">Versenyszám *</text>
  <rect x="66" y="206" width="490" height="34" rx="3" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="78" y="227" font-size="13" font-weight="600" fill="#111111">Rubik-kocka 3x3 (mp · Törtszám)</text>
  <text x="540" y="227" font-size="11" fill="#666666">▼</text>

  <text x="576" y="198" font-size="12" font-weight="700" fill="#333333">Elért érték *</text>
  <rect x="576" y="206" width="260" height="34" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="588" y="227" font-size="13" fill="#111111">28.45</text>

  <text x="856" y="198" font-size="12" font-weight="700" fill="#333333">Teljesítés dátuma *</text>
  <rect x="856" y="206" width="278" height="34" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="868" y="227" font-size="13" fill="#111111">2026-11-14</text>

  <!-- Category Hint Banner -->
  <rect x="66" y="254" width="1068" height="44" rx="4" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="82" y="281" font-size="12.5" font-weight="700" fill="#1e3a8a">Ajánlott bizonyítás ehhez a kategóriához: <tspan font-weight="400">1 közös fotó a kirakott kockáról és a timer kijelzőjéről (pl. csTimer idő + keverés).</tspan></text>

  <!-- Verification Menu Card (y=328..532) -->
  <rect x="48" y="328" width="1104" height="204" rx="6" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="66" y="352" font-size="15" font-weight="700" fill="#111111">Verifikációs bizonyíték megadása</text>
  <text x="342" y="352" font-size="11.5" fill="#555555">(Automatikusan kiválasztva a kategória ajánlott típusa)</text>

  <!-- 5-Tab Menu Bar (y=366..402) -->
  <rect x="66" y="366" width="176" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="154" y="389" font-size="12" font-weight="600" text-anchor="middle" fill="#444444">Nincs melléklet</text>

  <rect x="252" y="366" width="232" height="36" rx="4" fill="#222222"/>
  <text x="368" y="389" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">Fotó / Képernyőkép (Ajánlott)</text>

  <rect x="494" y="366" width="210" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="599" y="389" font-size="12" font-weight="600" text-anchor="middle" fill="#333333">Videó / Külső Link</text>

  <rect x="714" y="366" width="210" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="819" y="389" font-size="12" font-weight="600" text-anchor="middle" fill="#333333">Tanú / Jegyzőkönyv</text>

  <rect x="934" y="366" width="200" height="36" rx="4" fill="#ffffff" stroke="#bbbbbb" stroke-width="1"/>
  <text x="1034" y="389" font-size="12" font-weight="600" text-anchor="middle" fill="#333333">PDF Dokumentum</text>

  <!-- Active Tab Content Area (y=414..518) -->
  <rect x="66" y="414" width="1068" height="104" rx="4" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="84" y="438" font-size="13" font-weight="700" fill="#111111">Fotó vagy képernyőkép feltöltése *</text>
  <rect x="84" y="448" width="136" height="32" rx="3" fill="#222222"/>
  <text x="152" y="468" font-size="12" font-weight="600" text-anchor="middle" fill="#ffffff">Fájl választása</text>
  <rect x="228" y="448" width="520" height="32" rx="3" fill="#fafafa" stroke="#dddddd" stroke-width="1"/>
  <text x="242" y="468" font-size="12" fill="#111111">kocka_cstimer_2845.jpg  (1.4 MB · érvényes JPG kép)</text>
  <text x="84" y="502" font-size="11" fill="#555555">Engedélyezett: PNG, JPG, JPEG, GIF, WEBP (max. 10 MB). A többi melléklettípus mezője rejtve marad.</text>

  <!-- ==================== MIDDLE CALLOUTS [3] & [4] (y=562..642) ==================== -->
  <!-- Callout [3]: 5-elemű verifikációs menü -->
  <rect x="24" y="562" width="560" height="80" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="46" cy="584" r="11" fill="#1d4ed8"/>
  <text x="46" y="588" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
  <text x="66" y="588" font-size="13" font-weight="700" fill="#1e3a8a">Egykattintásos 5-elemű verifikációs menü</text>
  <text x="38" y="608" font-size="11.5" fill="#1e40af">Válassz a 5 lehetőség közül! Egyszerre csak a kiválasztott fül egyetlen</text>
  <text x="38" y="625" font-size="11.5" fill="#1e40af">beviteli mezője látszik, így nem tudsz hibás vagy üres adatot beküldeni.</text>
  <path d="M 38 562 L 38 384 L 62 384" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- Callout [4]: Aktív bizonyíték-mező -->
  <rect x="616" y="562" width="560" height="80" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="638" cy="584" r="11" fill="#1d4ed8"/>
  <text x="638" y="588" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
  <text x="658" y="588" font-size="13" font-weight="700" fill="#1e3a8a">Fotó, PDF vagy Külső Link csatolása</text>
  <text x="630" y="608" font-size="11.5" fill="#1e40af">Fotót és PDF-et közvetlenül feltölthetsz (max. 10 MB), a többi fülön pedig</text>
  <text x="630" y="625" font-size="11.5" fill="#1e40af">megadhatsz videó URL-t vagy szöveges tanú-jegyzőkönyvet.</text>
  <line x1="896" y1="562" x2="896" y2="522" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- ==================== BOTTOM PREVIEW CARDS (y=662..878) ==================== -->
  <!-- Card 1: Videó / Link -->
  <rect x="24" y="662" width="366" height="216" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="24" y="662" width="366" height="36" rx="5" fill="#f8fafc"/>
  <line x1="24" y1="698" x2="390" y2="698" stroke="#dddddd" stroke-width="1"/>
  <text x="42" y="685" font-size="13" font-weight="700" fill="#111111">Videó / Külső Link (LINK)</text>

  <text x="42" y="724" font-size="12" font-weight="600" fill="#333333">Videó vagy megosztott link *</text>
  <rect x="42" y="734" width="330" height="34" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="52" y="755" font-size="11" fill="#111111">https://youtube.com/shorts/sorfutas-1842</text>
  <text x="42" y="790" font-size="11" fill="#555555">• Támogatott: http:// vagy https:// URL.</text>
  <text x="42" y="810" font-size="11" fill="#555555">• Telefonos videó Google Fotókról, Drive-ról,</text>
  <text x="50" y="826" font-size="11" fill="#555555">nem listázott YouTube Shorts vagy Strava link.</text>
  <text x="42" y="856" font-size="11" font-weight="600" fill="#1d4ed8">Csak ez az 1 mező jelenik meg aktív LINK fülnél.</text>

  <!-- Card 2: Tanú / Jegyzőkönyv -->
  <rect x="417" y="662" width="366" height="216" rx="5" fill="#ffffff" stroke="#2563eb" stroke-width="1.2"/>
  <rect x="417" y="662" width="366" height="36" rx="5" fill="#f8fafc"/>
  <line x1="417" y1="698" x2="783" y2="698" stroke="#dddddd" stroke-width="1"/>
  <text x="435" y="685" font-size="13" font-weight="700" fill="#111111">Tanú / Jegyzőkönyv (TEXT)</text>

  <text x="435" y="724" font-size="12" font-weight="600" fill="#333333">Részletes jegyzőkönyv *</text>
  <rect x="642" y="707" width="122" height="22" rx="3" fill="#dbeafe" stroke="#2563eb" stroke-width="1"/>
  <text x="703" y="722" font-size="10" font-weight="700" text-anchor="middle" fill="#1d4ed8">+ Sablon beszúrása</text>

  <rect x="435" y="736" width="330" height="84" rx="3" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <text x="445" y="756" font-size="11" fill="#111111">Jelenlévő tanú(k): Kovács Peti, Szabó Anna</text>
  <text x="445" y="776" font-size="11" fill="#111111">Helyszín és időpont: Koliszint 3, 2026-11-14</text>
  <text x="445" y="796" font-size="11" fill="#111111">Mérés módja: Papír strigula + tányér számolás</text>
  <text x="435" y="844" font-size="11" fill="#555555">• Egykattintásos sablon gomb segíti a védhető</text>
  <text x="443" y="860" font-size="11" fill="#555555">adatok (tanú, helyszín, eszköz) megadását.</text>

  <!-- Card 3: PDF & Nincs melléklet -->
  <rect x="810" y="662" width="366" height="216" rx="5" fill="#ffffff" stroke="#cccccc" stroke-width="1"/>
  <rect x="810" y="662" width="366" height="36" rx="5" fill="#f8fafc"/>
  <line x1="810" y1="698" x2="1176" y2="698" stroke="#dddddd" stroke-width="1"/>
  <text x="828" y="685" font-size="13" font-weight="700" fill="#111111">PDF (PDF) &amp; Nincs melléklet</text>

  <text x="828" y="724" font-size="12" font-weight="600" fill="#333333">PDF fájl kiválasztása (max. 10 MB) *</text>
  <rect x="828" y="734" width="330" height="34" rx="3" fill="#fafafa" stroke="#cccccc" stroke-width="1"/>
  <text x="838" y="755" font-size="11" fill="#111111">verseny_eredmenylista.pdf  (420 KB)</text>

  <rect x="828" y="782" width="330" height="82" rx="4" fill="#fafafa" stroke="#e5e7eb" stroke-width="1"/>
  <text x="840" y="802" font-size="12" font-weight="700" fill="#333333">Nincs melléklet mód:</text>
  <text x="840" y="822" font-size="11" fill="#555555">• Elrejti az összes bizonyíték-mezőt.</text>
  <text x="840" y="840" font-size="11" fill="#555555">• Bizalmi alapon vagy később pótolva is küldhető.</text>
  <text x="840" y="856" font-size="11" fill="#1d4ed8">• Beküldés után admin elbírálásra kerül.</text>

  <!-- ==================== TOP CALLOUTS [1] & [2] (y=12..90) ==================== -->
  <!-- Callout [1]: Alapadatok -->
  <rect x="24" y="12" width="560" height="78" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="46" cy="34" r="11" fill="#1d4ed8"/>
  <text x="46" y="38" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
  <text x="66" y="38" font-size="13" font-weight="700" fill="#1e3a8a">Alapadatok: Versenyszám, Érték és Dátum</text>
  <text x="38" y="58" font-size="11.5" fill="#1e40af">Válaszd ki a versenyszámot, írd be az elért eredményt a kategória</text>
  <text x="38" y="75" font-size="11.5" fill="#1e40af">mértékegységében (pl. mp, kg, db) és állítsd be a teljesítés dátumát.</text>
  <line x1="310" y1="90" x2="310" y2="202" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- Callout [2]: Kategória-specifikus ajánló sáv -->
  <rect x="616" y="12" width="560" height="78" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="638" cy="34" r="11" fill="#1d4ed8"/>
  <text x="638" y="38" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
  <text x="658" y="38" font-size="13" font-weight="700" fill="#1e3a8a">Kategória-specifikus bizonyítási javaslat</text>
  <text x="630" y="58" font-size="11.5" fill="#1e40af">Kategória választásakor automatikusan megjelenik az ajánlott bizonyítás</text>
  <text x="630" y="75" font-size="11.5" fill="#1e40af">szövege, és a verifikációs menü rögtön az ajánlott fülre vált.</text>
  <path d="M 1160 90 L 1160 276 L 1138 276" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>

  <!-- ==================== BOTTOM CALLOUT [5] (y=896..968) ==================== -->
  <rect x="24" y="896" width="1152" height="72" rx="5" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
  <circle cx="46" cy="918" r="11" fill="#1d4ed8"/>
  <text x="46" y="922" font-size="12" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
  <text x="66" y="922" font-size="13" font-weight="700" fill="#1e3a8a">Tanú-jegyzőkönyv gyors sablon &amp; alternatív beküldési módok</text>
  <text x="38" y="942" font-size="11.5" fill="#1e40af">Ha nincs képed vagy videód, válaszd a Tanú / Jegyzőkönyv fület: a „+ Sablon beszúrása” gomb kitölti a kötelező elemeket (tanúk, helyszín, mérés módja).</text>
  <text x="38" y="958" font-size="11.5" fill="#1e40af">Beküldés után a rekord „Függőben” állapotba kerül, és az adminisztrátor jóváhagyásával jelenik meg a ranglistán.</text>
  <path d="M 796 896 L 796 718 L 768 718" fill="none" stroke="#1d4ed8" stroke-width="2" marker-end="url(#help-arrow)"/>
</svg>
